<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer Pro</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#0f172a;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:450px;
    background:#1e293b;
    padding:30px;
    border-radius:22px;
    text-align:center;
    color:white;
    box-shadow:0 0 25px rgba(0,0,0,0.4);
}

.timer{
    font-size:70px;
    margin:25px 0;
    font-weight:bold;
}

.buttons{
    display:flex;
    gap:10px;
}

button{
    flex:1;
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    color:white;
}

.start{
    background:#22c55e;
}

.pause{
    background:#f59e0b;
}

.reset{
    background:#ef4444;
}

.mode{
    margin-top:20px;
    background:#334155;
    padding:15px;
    border-radius:12px;
    line-height:1.8;
}

</style>
</head>

<body>

<div class="container">

    <h2>Pomodoro Timer</h2>

    <div class="timer" id="timer">
        25:00
    </div>

    <div class="buttons">

        <button class="start"
        onclick="startTimer()">
        Start
        </button>

        <button class="pause"
        onclick="pauseTimer()">
        Pause
        </button>

        <button class="reset"
        onclick="resetTimer()">
        Reset
        </button>

    </div>

    <div class="mode" id="mode">

        📚 Focus Time

    </div>

</div>

<script>

let time = 25 * 60;

let timer =
document.getElementById("timer");

let mode =
document.getElementById("mode");

let interval;

let running = false;

function updateTimer(){

    let minutes =
    Math.floor(time / 60);

    let seconds =
    time % 60;

    timer.innerHTML =
    `${String(minutes).padStart(2,"0")}
    :
    ${String(seconds).padStart(2,"0")}`;
}

function startTimer(){

    if(running) return;

    running = true;

    interval = setInterval(() => {

        time--;

        updateTimer();

        if(time <= 0){

            clearInterval(interval);

            running = false;

            mode.innerHTML =
            "☕ Break Time";

            alert("Pomodoro Finished ✅");

            time = 5 * 60;

            updateTimer();
        }

    },1000);
}

function pauseTimer(){

    clearInterval(interval);

    running = false;
}

function resetTimer(){

    clearInterval(interval);

    running = false;

    time = 25 * 60;

    mode.innerHTML =
    "📚 Focus Time";

    updateTimer();
}

updateTimer();

</script>

</body>
</html>
